<!DOCTYPE html>
<html lang="da-DK">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dokument</title>
    <link rel="stylesheet" href="./kontakt.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500&family=Orbitron:wght@400..900&family=Special+Gothic+Expanded+One&display=swap"
        rel="stylesheet">
</head>

<body>

    <header class="site-header">
        <nav class="in-header">
            <button class="header-knap">
                <img src="./img/burgermenu.png" alt="burgermenu">
            </button>

            <a href="./index.html"><img src="./img/logo.png" alt="logo" class="header-knap"></a>

            <button class="header-knap">
                <img src="./img/sog.png" alt="søgefunktion">
            </button>
        </nav>
    </header>

    <main>
        <h1>Har du <span class="orange-tekst">spørgsmål</span> om at være på <span class="lilla-tekst">nettet</span>, er
            du i <span class="lilla-tekst">tvivl</span> om noget eller vil du bare gerne <span
                class="lilla-tekst">snakke?</span>
            <span class="orange-tekst">Kontakt</span> os her:
        </h1>

        <section class="kontakt-sektion">
            <h2>Skriv til os her</h2>
            <button class="kontakt-knap">
                <img src="./img/chat.png" alt="chat">
            </button>
            <button class="kontakt-knap">
                <img src="./img/sms.png" alt="chat">
            </button>

        </section>

        <section class="call-sektion">
            <h3>Ring til os her</h3>
            <button class="call-knap">
                <img src="./img/telefonnummer.png" alt="telefonnummer">
            </button>

        </section>

        <h2>Eller <span class="orange-tekst">skriv</span> her og <span class="lilla-tekst">vi</span> svarer <span
                class="lilla-tekst">dig</span> <span class="orange-tekst">hurtigst</span> muligt</h2>

        
        <div class="kontakt-form">
            <img src="./img/logo.png" alt="logo" class="logo-form">
            <form>
                <label class="visually-hidden" for="navn">Navn</label>
                <input id="navn" type="text" placeholder="Navn" required>

                <label class="visually-hidden" for="alder">Alder</label>
                <input id="alder" type="text" placeholder="Alder" required>

                <label class="visually-hidden" for="mail">E-mail</label>
                <input id="mail" type="email" placeholder="E-mail" required>

                <label class="visually-hidden" for="sporgsmol">Spørgsmål</label>
                <textarea id="sporgsmol" type="text" placeholder="Spørgsmål" required></textarea>
            </form>
            <button class="send-knap">
                <img src="./img/send.png" alt="send knap">
            </button>
        </div>
    </main>

    <footer>
        <div class="footer-tekst">
            <a href="index.html"><img src="./img/logo.png" alt="logo"></a>
            <address>Adresse 184<br>
                By 7492</address>

            <address>Telefon: 00 00 00 00<br>
                Email: email@mail.dk </address>
        </div>

        <div class="footer-billeder">
            <div class="billeder-tekst">
                <a href="#"><img src="./img/instagram.jpg" alt="instagram"></a>
                <div href="#"><img src="./img/round-icons-NEglEsR7cTM-unsplash.jpg" alt="facebook"></a>
                </div>

            </div>
            <div class="footer-samle">
                <p>Instagram</p>
                <p>Facebook</p>
            </div>

    </footer>


</body>

</html>
